[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "customer-workflow-agent"
version = "0.1.0"
description = "Customer-service workflow agent (LangGraph) on the τ²-bench retail store"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "langgraph>=1.2.13,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.4.7,<2",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "aiosqlite>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_workflow_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: calls the real NVIDIA API (needs NVIDIA_API_KEY)",
    "sse: starts a real uvicorn server on 127.0.0.1",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
